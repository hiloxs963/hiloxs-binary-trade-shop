name: API CI

on:
  pull_request:
    paths:
      - "api/**"
      - "docs/adr/0001-backend-trust-boundary.md"
      - "docs/adr/0008-secure-product-media-and-catalog-activation.md"
      - ".github/workflows/api-ci.yml"
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "docs/adr/0001-backend-trust-boundary.md"
      - "docs/adr/0008-secure-product-media-and-catalog-activation.md"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  validate-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hiloxs
          POSTGRES_PASSWORD: hiloxs_test
          POSTGRES_DB: hiloxs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiloxs -d hiloxs_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      minio:
        image: bitnamilegacy/minio@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
        env:
          MINIO_ROOT_USER: hiloxs_test_access
          MINIO_ROOT_PASSWORD: hiloxs_test_secret_12345
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    defaults:
      run:
        working-directory: api

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://hiloxs:hiloxs_test@localhost:5432/hiloxs_test
      MEDIA_UPLOAD_ENABLED: "true"
      CATALOG_ACTIVATION_ENABLED: "true"
      MEDIA_S3_ENDPOINT: http://localhost:9000
      MEDIA_S3_REGION: us-east-1
      MEDIA_S3_BUCKET: hiloxs-media-test
      MEDIA_S3_ACCESS_KEY_ID: hiloxs_test_access
      MEDIA_S3_SECRET_ACCESS_KEY: hiloxs_test_secret_12345
      MEDIA_S3_FORCE_PATH_STYLE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Lint API
        run: npm run lint

      - name: Typecheck API
        run: npm run typecheck

      - name: Run API unit tests
        run: npm run test

      - name: Run API PostgreSQL integration tests
        run: npm run test:integration

      - name: Build API
        run: npm run build
