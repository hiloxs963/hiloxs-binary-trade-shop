name: Build and deploy cPanel branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

      - name: Confirm static output
        run: npm run verify:production

      - name: Stage cPanel static release
        run: |
          mkdir -p "$RUNNER_TEMP/hiloxs-release"
          cp -a dist/client/. "$RUNNER_TEMP/hiloxs-release/"
          test -f "$RUNNER_TEMP/hiloxs-release/release-manifest.json"
          test -f "$RUNNER_TEMP/hiloxs-release/.htaccess"

      - name: Publish cPanel branch
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: cpanel-deploy
          publish_dir: ${{ runner.temp }}/hiloxs-release
          force_orphan: true
